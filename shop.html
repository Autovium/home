<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autovium Technologies | Hardware Components & Systems Catalog</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons & Tailwind CSS -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for parsing CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        base: '#050505',
                        surface: '#111111',
                        border: '#222222',
                        accent: '#10b981', // Emerald
                        highlight: '#fbbf24', // Amber
                    },
                    animation: {
                        'glow': 'glow 4s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        glow: {
                            '0%': { opacity: '0.3', filter: 'blur(40px)' },
                            '100%': { opacity: '0.6', filter: 'blur(60px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #050505; 
            color: #ededed;
            overflow-x: hidden;
        }
        
        .noise-bg {
            position: fixed;
            inset: 0;
            z-index: 50;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }

        .glass-panel {
            background: rgba(17, 17, 17, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-panel:hover {
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(17, 17, 17, 0.85);
        }

        .text-gradient-accent {
            background: linear-gradient(135deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="antialiased selection:bg-accent selection:text-base min-h-screen flex flex-col">
    <div class="noise-bg"></div>

    <!-- Background Glow Blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-accent/20 rounded-full mix-blend-screen filter blur-[100px] animate-glow pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-highlight/10 rounded-full mix-blend-screen filter blur-[120px] animate-glow pointer-events-none z-0" style="animation-delay: 2s;"></div>

    <!-- Navigation Header -->
    <nav class="fixed w-full z-50 top-0 pt-6 px-6 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto glass-panel rounded-full px-6 py-3 flex justify-between items-center">
            <a href="#catalog" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded bg-accent/20 border border-accent/40 flex items-center justify-center text-accent group-hover:scale-105 transition-transform">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                </div>
                <span class="font-display font-bold text-lg tracking-wide text-white">Autovium <span class="text-accent">Hardware</span></span>
            </a>
            
            <div class="flex items-center gap-4">
                <span id="data-status-badge" class="hidden md:inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono bg-accent/10 border border-accent/30 text-accent">
                    <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span> AUTO-SYNC ACTIVE
                </span>
                <label for="csv-file-input" class="cursor-pointer text-xs font-mono glass-panel px-3 py-1.5 rounded-full text-neutral-300 hover:text-accent border-dashed border-white/20 hover:border-accent transition-colors flex items-center gap-1.5">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> Custom CSV
                    <input type="file" id="csv-file-input" accept=".csv" class="hidden">
                </label>
            </div>
        </div>
    </nav>

    <!-- Main Dynamic Content Container -->
    <main class="flex-grow pt-28 pb-20 relative z-10 max-w-7xl mx-auto px-6 w-full" id="app-container">
        <!-- Content injected dynamically via hash route -->
    </main>

    <!-- Global Footer -->
    <footer class="border-t border-white/5 py-8 relative z-10 bg-base">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i data-lucide="cpu" class="w-4 h-4 text-accent"></i>
                <span class="font-display font-bold text-sm text-white">Autovium Technologies</span>
            </div>
            <p class="text-neutral-500 font-mono text-xs">&copy; 2026 Autovium Technologies. Live Data Sync from GitHub repository.</p>
        </div>
    </footer>

    <!-- Application Script -->
    <script>
        // Global State
        let productsData = [];
        let categoriesList = [];
        let activeCategory = 'All';
        let searchQuery = '';
        let viewMode = 'grid'; // 'grid' or 'list'
        let inStockOnly = false;
        let featuredOnly = false;

        // Auto-load products.csv on launch
        document.addEventListener('DOMContentLoaded', () => {
            initCSVAutoLoad();
            setupCSVUploader();
            window.addEventListener('hashchange', handleRoute);
        });

        // 1. Fetch CSV automatically from local folder or GitHub Pages root
        async function initCSVAutoLoad() {
            const statusBadge = document.getElementById('data-status-badge');
            try {
                const response = await fetch('./products.csv?v=' + new Date().getTime());
                if (!response.ok) throw new Error("products.csv fetch failed");
                const csvText = await response.text();
                parseAndSetCSV(csvText);
            } catch (err) {
                console.warn("Local fetch failed, running fallback parsing...", err);
                if (statusBadge) {
                    statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-highlight"></span> CSV LOAD ERROR`;
                    statusBadge.classList.replace('text-accent', 'text-highlight');
                }
            }
        }

        // 2. CSV Parser Engine
        function parseAndSetCSV(csvText) {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                dynamicTyping: true,
                complete: function(results) {
                    productsData = results.data.map(item => ({
                        id: String(item.ID || item.id || Math.random()),
                        sku: item.SKU || item.sku || 'N/A',
                        name: item.Name || item.name || 'Unnamed Hardware Component',
                        category: (item.Categories || item.categories || 'Uncategorized').split('>')[0].trim(),
                        fullCategory: item.Categories || item.categories || 'General',
                        shortDescription: item["Short description"] || item.short_description || '',
                        description: item.Description || item.description || '',
                        regularPrice: item["Regular price"] || item.regular_price || 0,
                        salePrice: item["Sale price"] || item.sale_price || null,
                        inStock: Number(item["In stock?"] ?? item.in_stock ?? 1) === 1,
                        stockCount: Number(item.Stock ?? item.stock ?? 0),
                        isFeatured: Number(item["Is featured?"] ?? item.is_featured ?? 0) === 1,
                        weight: item["Weight (g)"] || item.weight || 'N/A',
                        length: item["Length (mm)"] || item.length || 'N/A',
                        width: item["Width (mm)"] || item.width || 'N/A',
                        height: item["Height (mm)"] || item.height || 'N/A',
                        tags: item.Tags || item.tags || '',
                        brand: item.Brands || item.brand || 'Autovium',
                        image: (item.Images || item.images || '').split(',')[0].trim() || 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop&q=80'
                    }));

                    extractCategories();
                    handleRoute();
                }
            });
        }

        function setupCSVUploader() {
            const input = document.getElementById('csv-file-input');
            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => parseAndSetCSV(evt.target.result);
                    reader.readAsText(file);
                }
            });
        }

        function extractCategories() {
            const catMap = {};
            productsData.forEach(p => {
                catMap[p.category] = (catMap[p.category] || 0) + 1;
            });
            categoriesList = Object.keys(catMap).map(cat => ({ name: cat, count: catMap[cat] }));
        }

        // Router (Catalog View vs Single Product View)
        function handleRoute() {
            const hash = window.location.hash || '#catalog';
            const container = document.getElementById('app-container');

            if (hash.startsWith('#product')) {
                const params = new URLSearchParams(hash.split('?')[1]);
                const productId = params.get('id');
                const product = productsData.find(p => p.id === productId);

                if (product) {
                    renderProductDetailView(container, product);
                } else {
                    renderCatalogView(container);
                }
            } else {
                renderCatalogView(container);
            }
            lucide.createIcons();
        }

        // RENDER 1: Catalog Component Search & Filter Matrix
        function renderCatalogView(container) {
            const filteredProducts = productsData.filter(p => {
                const matchesCat = activeCategory === 'All' || p.category === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      p.sku.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      p.tags.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesStock = !inStockOnly || p.inStock;
                const matchesFeatured = !featuredOnly || p.isFeatured;
                return matchesCat && matchesSearch && matchesStock && matchesFeatured;
            });

            container.innerHTML = `
                <!-- Catalog Header -->
                <div class="mb-10 text-center md:text-left flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-white/5 pb-8">
                    <div>
                        <div class="inline-flex items-center gap-2 glass-panel px-3 py-1 rounded-full text-xs font-mono text-accent mb-3">
                            <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span> SYSTEM_CATALOG // LIVE_SYNC
                        </div>
                        <h1 class="text-4xl md:text-5xl font-display font-black text-white tracking-tight">Component Matrix</h1>
                        <p class="text-neutral-400 font-light mt-1">Browse and search engineered electronic parts and micro-controllers.</p>
                    </div>

                    <!-- Search Input Box -->
                    <div class="w-full md:w-96 relative">
                        <i data-lucide="search" class="w-4 h-4 text-neutral-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                        <input type="text" id="search-bar" value="${searchQuery}" placeholder="Search name, SKU, or tags..." 
                               class="w-full glass-panel pl-11 pr-4 py-3 rounded-full text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-accent transition-colors font-sans">
                    </div>
                </div>

                <!-- Catalog Grid Layout -->
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                    <!-- Left Sidebar Filters -->
                    <aside class="space-y-6">
                        <!-- Category Filter Card -->
                        <div class="glass-panel p-6 rounded-3xl">
                            <h3 class="text-xs font-mono uppercase tracking-widest text-neutral-400 mb-4 flex items-center justify-between">
                                Categories <i data-lucide="filter" class="w-3.5 h-3.5 text-accent"></i>
                            </h3>
                            <div class="space-y-1">
                                <button onclick="setCategory('All')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-medium transition-colors flex justify-between items-center ${activeCategory === 'All' ? 'bg-accent/20 text-accent border border-accent/30' : 'text-neutral-400 hover:text-white hover:bg-white/5'}">
                                    <span>All Components</span>
                                    <span class="text-xs font-mono px-2 py-0.5 rounded bg-white/5 text-neutral-400">${productsData.length}</span>
                                </button>
                                ${categoriesList.map(cat => `
                                    <button onclick="setCategory('${cat.name}')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-medium transition-colors flex justify-between items-center ${activeCategory === cat.name ? 'bg-accent/20 text-accent border border-accent/30' : 'text-neutral-400 hover:text-white hover:bg-white/5'}">
                                        <span class="truncate">${cat.name}</span>
                                        <span class="text-xs font-mono px-2 py-0.5 rounded bg-white/5 text-neutral-400">${cat.count}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Availability & Toggle Options -->
                        <div class="glass-panel p-6 rounded-3xl space-y-4">
                            <h3 class="text-xs font-mono uppercase tracking-widest text-neutral-400 mb-2">Filters</h3>
                            <label class="flex items-center justify-between cursor-pointer text-sm text-neutral-300 hover:text-white">
                                <span>In Stock Only</span>
                                <input type="checkbox" id="stock-toggle" ${inStockOnly ? 'checked' : ''} onchange="toggleStockOnly(this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
                            </label>
                            <label class="flex items-center justify-between cursor-pointer text-sm text-neutral-300 hover:text-white">
                                <span>Featured Parts</span>
                                <input type="checkbox" id="featured-toggle" ${featuredOnly ? 'checked' : ''} onchange="toggleFeaturedOnly(this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
                            </label>
                        </div>
                    </aside>

                    <!-- Main Components Presentation View -->
                    <section class="lg:col-span-3 space-y-6">
                        <!-- Top Toolbar -->
                        <div class="flex justify-between items-center glass-panel px-6 py-3 rounded-2xl text-xs font-mono text-neutral-400">
                            <div>RESULTS: <span class="text-accent">${filteredProducts.length}</span> UNITS FOUND</div>
                            <div class="flex items-center gap-2">
                                <button onclick="setViewMode('grid')" class="p-1.5 rounded-lg ${viewMode === 'grid' ? 'bg-accent/20 text-accent' : 'hover:text-white'}">
                                    <i data-lucide="grid" class="w-4 h-4"></i>
                                </button>
                                <button onclick="setViewMode('list')" class="p-1.5 rounded-lg ${viewMode === 'list' ? 'bg-accent/20 text-accent' : 'hover:text-white'}">
                                    <i data-lucide="list" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        ${filteredProducts.length === 0 ? `
                            <div class="glass-panel p-16 rounded-3xl text-center space-y-4">
                                <i data-lucide="alert-circle" class="w-12 h-12 text-highlight mx-auto"></i>
                                <h3 class="text-xl font-display font-bold text-white">No Components Found</h3>
                                <p class="text-sm text-neutral-400">Try adjusting your search query or reset category filters.</p>
                            </div>
                        ` : viewMode === 'grid' ? `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${filteredProducts.map(p => `
                                    <div class="glass-panel rounded-3xl p-5 flex flex-col justify-between group transition-all duration-300">
                                        <div>
                                            <div class="h-44 rounded-2xl overflow-hidden bg-black/60 relative mb-4">
                                                <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90">
                                                <div class="absolute top-3 left-3 bg-base/80 backdrop-blur-md px-2.5 py-1 rounded-md border border-white/10 text-[10px] font-mono text-neutral-300">
                                                    ${p.sku}
                                                </div>
                                                ${p.isFeatured ? `
                                                    <div class="absolute top-3 right-3 bg-highlight/20 border border-highlight/40 text-highlight backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-mono">
                                                        FEATURED
                                                    </div>
                                                ` : ''}
                                            </div>

                                            <div class="text-[11px] font-mono text-accent mb-1 uppercase tracking-wider">${p.category}</div>
                                            <h4 class="font-display font-bold text-lg text-white mb-2 leading-snug group-hover:text-accent transition-colors">${p.name}</h4>
                                            <p class="text-xs text-neutral-400 line-clamp-2 leading-relaxed mb-4">${p.shortDescription}</p>
                                        </div>

                                        <div class="pt-4 border-t border-white/5 flex items-center justify-between">
                                            <div>
                                                <span class="text-xs font-mono text-neutral-500">PRICE</span>
                                                <div class="text-base font-display font-bold text-white">LKR ${p.salePrice || p.regularPrice}</div>
                                            </div>
                                            <a href="#product?id=${p.id}" class="px-4 py-2 bg-white/10 hover:bg-accent hover:text-base text-white text-xs font-mono font-bold rounded-xl transition-all flex items-center gap-1">
                                                SPECS <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                                            </a>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : `
                            <!-- List View -->
                            <div class="glass-panel rounded-3xl divide-y divide-white/5 overflow-hidden">
                                ${filteredProducts.map(p => `
                                    <div class="p-4 flex items-center justify-between gap-4 hover:bg-white/5 transition-colors">
                                        <div class="flex items-center gap-4">
                                            <img src="${p.image}" class="w-12 h-12 rounded-xl object-cover bg-black">
                                            <div>
                                                <span class="text-[10px] font-mono text-accent">${p.sku}</span>
                                                <h4 class="font-display font-bold text-white text-sm">${p.name}</h4>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-6">
                                            <div class="text-right">
                                                <div class="text-sm font-display font-bold text-white">LKR ${p.salePrice || p.regularPrice}</div>
                                                <span class="text-[10px] font-mono ${p.inStock ? 'text-accent' : 'text-neutral-500'}">${p.inStock ? 'IN STOCK' : 'OUT OF STOCK'}</span>
                                            </div>
                                            <a href="#product?id=${p.id}" class="px-4 py-2 glass-panel text-xs font-mono text-white hover:text-accent rounded-xl">View</a>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </section>
                </div>
            `;

            // Setup real-time search event listener
            document.getElementById('search-bar').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderCatalogView(container);
                lucide.createIcons();
            });
        }

        // RENDER 2: Dedicated Product Specifications View Page
        function renderProductDetailView(container, product) {
            container.innerHTML = `
                <!-- Breadcrumbs -->
                <div class="mb-8 flex items-center gap-2 text-xs font-mono text-neutral-400">
                    <a href="#catalog" class="hover:text-accent transition-colors flex items-center gap-1">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> CATALOG
                    </a>
                    <span>/</span>
                    <span class="text-neutral-500">${product.category}</span>
                    <span>/</span>
                    <span class="text-accent truncate">${product.name}</span>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
                    <!-- Image Card View -->
                    <div class="glass-panel p-6 rounded-3xl relative overflow-hidden">
                        <div class="h-96 md:h-[450px] rounded-2xl overflow-hidden bg-black/80 relative">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="mt-4 flex justify-between items-center font-mono text-xs text-neutral-400">
                            <span>SKU: <strong class="text-white">${product.sku}</strong></span>
                            <span>BRAND: <strong class="text-white">${product.brand}</strong></span>
                        </div>
                    </div>

                    <!-- Details & Specifications Panel -->
                    <div class="space-y-8">
                        <div>
                            <div class="inline-block px-3 py-1 rounded-md bg-accent/10 border border-accent/20 text-accent font-mono text-xs mb-3">
                                ${product.category}
                            </div>
                            <h1 class="text-3xl md:text-4xl font-display font-bold text-white mb-4 leading-tight">${product.name}</h1>
                            <p class="text-neutral-300 leading-relaxed text-sm">${product.shortDescription}</p>
                        </div>

                        <!-- Price & Stock Indicator -->
                        <div class="glass-panel p-6 rounded-2xl flex items-center justify-between">
                            <div>
                                <span class="text-xs font-mono text-neutral-400 block">UNIT PRICE</span>
                                <div class="text-3xl font-display font-black text-white">
                                    LKR ${product.salePrice || product.regularPrice}
                                    ${product.salePrice ? `<span class="text-sm line-through text-neutral-500 ml-2">LKR ${product.regularPrice}</span>` : ''}
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono ${product.inStock ? 'bg-accent/10 border border-accent/30 text-accent' : 'bg-red-500/10 border border-red-500/30 text-red-400'}">
                                    <span class="w-2 h-2 rounded-full ${product.inStock ? 'bg-accent' : 'bg-red-500'}"></span>
                                    ${product.inStock ? `IN STOCK (${product.stockCount} AVAILABLE)` : 'BACKORDER'}
                                </span>
                            </div>
                        </div>

                        <!-- Physical Dimensions Matrix -->
                        <div class="glass-panel p-6 rounded-2xl space-y-3">
                            <h3 class="text-xs font-mono uppercase tracking-widest text-neutral-400 mb-2">Physical Specifications</h3>
                            <div class="grid grid-cols-4 gap-2 text-center">
                                <div class="p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span class="block text-[10px] font-mono text-neutral-500">WEIGHT</span>
                                    <span class="text-sm font-mono text-white">${product.weight} g</span>
                                </div>
                                <div class="p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span class="block text-[10px] font-mono text-neutral-500">LENGTH</span>
                                    <span class="text-sm font-mono text-white">${product.length} mm</span>
                                </div>
                                <div class="p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span class="block text-[10px] font-mono text-neutral-500">WIDTH</span>
                                    <span class="text-sm font-mono text-white">${product.width} mm</span>
                                </div>
                                <div class="p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span class="block text-[10px] font-mono text-neutral-500">HEIGHT</span>
                                    <span class="text-sm font-mono text-white">${product.height} mm</span>
                                </div>
                            </div>
                        </div>

                        <!-- Full Technical Description -->
                        <div class="glass-panel p-6 rounded-2xl space-y-3">
                            <h3 class="text-xs font-mono uppercase tracking-widest text-neutral-400 mb-2">Technical Description</h3>
                            <div class="prose prose-invert max-w-none text-neutral-300 text-sm leading-relaxed">
                                ${product.description || '<p>No extended datasheet specifications uploaded.</p>'}
                            </div>
                        </div>

                        <!-- Inquiry & Contact Button -->
                        <div class="pt-4 flex gap-4">
                            <a href="mailto:admin@autovium.com?subject=Inquiry for ${encodeURIComponent(product.name)} [SKU: ${product.sku}]" class="flex-1 py-4 bg-white hover:bg-accent text-base hover:text-base font-display font-bold rounded-2xl transition-all text-center flex items-center justify-center gap-2">
                                <i data-lucide="mail" class="w-4 h-4"></i> Request Quote / Order
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // Helper Controllers
        function setCategory(cat) {
            activeCategory = cat;
            handleRoute();
        }

        function setViewMode(mode) {
            viewMode = mode;
            handleRoute();
        }

        function toggleStockOnly(val) {
            inStockOnly = val;
            handleRoute();
        }

        function toggleFeaturedOnly(val) {
            featuredOnly = val;
            handleRoute();
        }
    </script>
</body>
</html>
